<div class="modal" [ngClass]="{'is-active':Inventario}">
    <div class="modal-background" (click)='cerrar()'></div>
    <div class="modal-card">
        <div class="modal-card-body">
            <div class="subtitulo">Ingreso de Inventario</div>
            <div class="columns">
                <div class="column">
                    <div class="field">
                        <label class="label">Categoria:</label>
                        <div class="select">
                            <select name="" id="Nuevoproducto" (change)="CargarMateriales()"
                                [(ngModel)]="grupo_selected">
                                <option value="0">Selecciona Categoria</option>
                                <option value="{{seccion._id}}" *ngFor='let seccion of grupos'>
                                    {{seccion.nombre}}
                                </option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="column">
                    <div class="field">
                        <label class="label">Producto:</label>
                        <div class="select">
                            <select name="" id="Producto_select" [disabled]="!grupo_selected"
                                [(ngModel)]="data.material">
                                <option value="0">Selecciona Producto</option>
                                <ng-container *ngFor='let producto of materiales_filtrados'>
                                    <option value="{{producto._id}}">{{producto.nombre}} <ng-container
                                            *ngIf="producto.ancho">({{producto.ancho}} x
                                            {{producto.largo}})</ng-container> ({{producto.marca}}<ng-container
                                            *ngIf="!producto.ancho"> - {{producto.presentacion}}
                                            {{producto.neto}}{{producto.unidad}}</ng-container>)
                                        <ng-container *ngIf="producto.ancho">
                                            (Gramaje: {{producto.gramaje}} Calibre: {{producto.calibre}})
                                        </ng-container>
                                    </option>
                                </ng-container>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="columns" *ngIf='data.material'>
                <div class="column is-4">
                    <div class="field">
                        <label class="label">N° de pedido</label>
                        <div class="control">
                            <input type="text" class="input" [(ngModel)]="data.pedido">
                        </div>
                    </div>
                </div>
                <div class="column is-4">
                    <div class="field">
                        <label class="label">Precio (USD)</label>
                        <div class="control">
                            <input type="number" class="input" [(ngModel)]="data.precio">
                        </div>
                    </div>
                </div>
            </div>
            <div class="columns" *ngIf='data.material'>
                <div class="column">
                    <div class="field">
                        <label class="label">Código</label>
                        <div class="control">
                            <input type="text" class="input" [(ngModel)]="data.codigo">
                        </div>
                    </div>
                </div>
                <div class="column">
                    <div class="field">
                        <label class="label">Lote</label>
                        <div class="control">
                            <input type="text" class="input" [(ngModel)]="data.lote" [disabled]="!data.codigo">
                        </div>
                    </div>
                </div>
                <div class="column">
                    <div class="field">
                        <label class="label">Cantidad</label>
                        <div class="control">
                            <input type="text" class="input" [(ngModel)]="data.cantidad" [disabled]="!data.lote">
                        </div>
                    </div>
                </div>
            </div>
            <div class="field">
                <div class="control" *ngIf="GrupoNombre() === 'Sustrato'">
                    <input type="checkbox" name="" id="" [checked]="fuera" (change)="fuera = !fuera"> Almacenar en
                    "Wil
                    Projects, C.A."
                </div>
                <div class="control">
                    <button class="button is-primary" [disabled]="!data.cantidad"
                        (click)='almacenar()'>Finalizar</button>
                </div>
            </div>
        </div>
    </div>
</div>
