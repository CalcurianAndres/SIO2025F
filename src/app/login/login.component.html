<div class="fondo">
  <div class="login">
    <!-- ****************************** -->
    <form autocomplete="off" [formGroup]="loginForm" (ngSubmit)="login()">
      <img src="../../assets/LOGIN-SIO_ano.png" alt="Poligrafica Industrial">
      <div class="field mt-5">
        <div class="field has-addons">
          <input class="input" type="Email" placeholder="Correo electronico" formControlName='Correo' [ngModel]='email'>
        </div>
      </div>
      <div class="field">
        <p class="control has-icons-left">
          <input class="input" type="password" placeholder="Contraseña" formControlName='Password'>
          <span class="icon is-small is-left">
            <i class="fas fa-lock"></i>
          </span>
        </p>
      </div>
      <!-- <div class="field">
             <p class="control has-icons-left">
               <input class="input" 
                       type="password" 
                       placeholder="Contraseña"
                       formControlName='Password'>
               <span class="icon is-small is-left">
                 <i class="fas fa-lock"></i>
               </span>
             </p>
           </div> -->
      <div class="field">
        <input class="is-checkradio has-background-color is-success" id="exampleCheckboxBackgroundColorSuccess"
          type="checkbox" name="exampleCheckboxBackgroundColorSuccess" checked="checked" formControlName='remember'>
        <label for="exampleCheckboxBackgroundColorSuccess">Recuérdame</label>
      </div>
      <button class="button is-fullwidth is-primary" [ngClass]="{'is-loading':cargando}" id='remember'>Ingresar</button>
    </form>
    <!-- ****************************** -->
  </div>
</div>
